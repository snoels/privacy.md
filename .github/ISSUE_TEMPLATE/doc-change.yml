name: Discuss a change to the document
description: Something in BRIEF.md is wrong, missing, or should be argued differently.
title: "doc: "
labels: ["document"]
body:
  - type: markdown
    attributes:
      value: |
        For anything about **what we're saying** — the pitch, the demo, the
        rules, the evidence. You do not need to know how to code to file this.

        Small and obviously right? Just edit
        [BRIEF.md](../blob/main/BRIEF.md) directly instead — pencil icon, no
        permission needed. Use this form when it's worth discussing first.
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: Quote the line or name the section. Plain language is fine.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's wrong with it as it stands, or what it's missing.
    validations:
      required: true
  - type: dropdown
    id: touches_build
    attributes:
      label: Does this change what we build?
      options:
        - "No — it's about how we say it"
        - "Yes — the implementation would have to change too"
        - "Not sure"
    validations:
      required: true
