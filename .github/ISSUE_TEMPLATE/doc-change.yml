name: Change the document
description: Something in the brief is wrong, missing, or should be argued differently.
title: "doc: "
labels: ["document"]
body:
  - type: markdown
    attributes:
      value: |
        For anything about **what we're saying** — the pitch, the demo, the
        rules, the evidence. You do not need to know how to code to file this.

        Small and obvious? Just edit the file directly (pencil icon) instead.
        Use this when it's worth discussing first.
  - type: dropdown
    id: file
    attributes:
      label: Which part
      options:
        - docs/concept.md — thesis, outcomes, the interruption
        - docs/constitution.md — policy file, onboarding, rules
        - docs/demo.md — the demo arc and measurement
        - docs/evidence.md — incidents and judge questions
        - docs/build.md — build order and open calls
        - Not sure / spans several
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: Quote the line if you can. Plain language is fine.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's wrong with it as it stands, or what it's missing.
    validations:
      required: true
  - type: dropdown
    id: touches_build
    attributes:
      label: Does this change what we build?
      options:
        - "No — it's about how we say it"
        - "Yes — the implementation would have to change too"
        - "Not sure"
    validations:
      required: true
