name: Document change that affects the build
description: Something in the brief changed (or should change) in a way the implementation has to follow.
title: "doc: "
labels: ["document"]
body:
  - type: markdown
    attributes:
      value: |
        **Most feedback does not belong here.** To suggest a change to the
        brief, comment on the document itself, or just edit it.

        Use this form only when a change means the **implementation** has to
        move too — otherwise the build team won't see it.
  - type: textarea
    id: change
    attributes:
      label: What changed in the document
      description: Quote the section or the line.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: What the build now has to do differently
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Does the demo break without this?
      options:
        - "Yes — the demo does not work unless we change it"
        - "No — it makes the demo better"
    validations:
      required: true
