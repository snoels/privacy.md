<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="privacy.md — AGENTS.md tells an agent how to work. privacy.md tells it what it may send.">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1280" height="400" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#21262D" stroke-width="1"/>

  <!-- ── left: the wordmark ── -->
  <text class="mono" x="72" y="150" font-size="82" font-weight="600" fill="#E6EDF3">privacy<tspan fill="#58A6FF">.md</tspan></text>

  <rect x="74" y="182" width="132" height="3" fill="#58A6FF"/>

  <text class="sans" x="72" y="240" font-size="23" fill="#8B949E">
    <tspan class="mono" fill="#8B949E">AGENTS.md</tspan> tells an agent how to work.
  </text>
  <text class="sans" x="72" y="276" font-size="23" fill="#E6EDF3">
    <tspan class="mono" fill="#E6EDF3">privacy.md</tspan> tells it what it may send.
  </text>

  <!-- the boundary, in one line -->
  <text class="mono" x="72" y="336" font-size="15" fill="#6E7681">
    checked before the call goes out, not after
  </text>

  <!-- ── right: what that means on one tool call ── -->
  <rect x="744" y="70" width="464" height="260" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>

  <!-- card chrome -->
  <circle cx="768" cy="94" r="5" fill="#30363D"/>
  <circle cx="786" cy="94" r="5" fill="#30363D"/>
  <circle cx="804" cy="94" r="5" fill="#30363D"/>
  <text class="mono" x="822" y="99" font-size="13" fill="#6E7681">agent proposes a call</text>
  <line x1="744" y1="116" x2="1208" y2="116" stroke="#30363D" stroke-width="1"/>

  <text class="mono" x="768" y="146" font-size="15" fill="#E6EDF3">calendar.events.create</text>

  <text class="mono" x="768" y="182" font-size="15" fill="#8B949E">title</text>
  <text class="mono" x="880" y="182" font-size="15" fill="#E6EDF3">Appointment</text>
  <text class="mono" x="1148" y="182" font-size="15" fill="#3FB950">sent</text>

  <text class="mono" x="768" y="208" font-size="15" fill="#8B949E">start</text>
  <text class="mono" x="880" y="208" font-size="15" fill="#E6EDF3">2026-09-11 14:00</text>
  <text class="mono" x="1148" y="208" font-size="15" fill="#3FB950">sent</text>

  <text class="mono" x="768" y="234" font-size="15" fill="#8B949E">notes</text>
  <text class="mono" x="880" y="234" font-size="15" fill="#6E7681" text-decoration="line-through">Physio, ref #A2213</text>
  <text class="mono" x="1124" y="234" font-size="15" fill="#F85149">held</text>

  <text class="mono" x="768" y="260" font-size="15" fill="#8B949E">attendee</text>
  <text class="mono" x="880" y="260" font-size="15" fill="#6E7681" text-decoration="line-through">+32 470 88 21 04</text>
  <text class="mono" x="1124" y="260" font-size="15" fill="#F85149">held</text>

  <line x1="768" y1="282" x2="1184" y2="282" stroke="#30363D" stroke-width="1"/>

  <text class="mono" x="768" y="308" font-size="14" fill="#BC8CFF">REDACT</text>
  <text class="mono" x="836" y="308" font-size="14" fill="#8B949E">2 fields held ·</text>
  <text class="mono" x="962" y="308" font-size="14" fill="#3FB950">the event was still created</text>
</svg>
